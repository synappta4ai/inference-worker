syntax = "proto3";

package maestro.inference.v1;

// The Go side is mirrored into back-synapta as internal/worker/proto.
option go_package = "synapta/internal/worker/proto;inferencev1";

service InferenceService {
  // Streaming de progreso de generación de video/imagen
  rpc GenerateMedia (MediaGenerationRequest) returns (stream GenerationProgressResponse);
  
  // Cancelar una generación en curso
  rpc CancelGeneration (CancelRequest) returns (CancelResponse);
  
  // Transcripción y análisis de audio
  rpc TranscribeAudio (AudioTranscriptionRequest) returns (TranscriptionResponse);
  
  // Mejora de prompts con LLM local
  rpc EnhancePrompt (PromptEnhanceRequest) returns (PromptEnhanceResponse);
  
  // Estado y telemetría de GPU / VRAM
  rpc GetGpuTelemetry (GpuTelemetryRequest) returns (GpuTelemetryResponse);
  
  // Catálogo de modelos disponibles (motores, VRAM, disponibilidad)
  rpc ListModels (ListModelsRequest) returns (ListModelsResponse);

  // Gestión de pesos: descarga en segundo plano (el progreso se lee con
  // GetModelState o en el campo download_* de ModelInfo de ListModels).
  // cancel=true aborta la descarga en curso de esa clave.
  rpc DownloadModel (DownloadModelRequest) returns (ModelOperationResponse);

  // Borrado de los pesos en disco de un modelo (libera el disco)
  rpc DeleteModel (DeleteModelRequest) returns (ModelOperationResponse);

  // Disponibilidad: estado de descarga de un modelo (clave vacía = todos)
  rpc GetModelState (GetModelStateRequest) returns (GetModelStateResponse);
}

message ListModelsRequest {}

message ModelInfo {
  string key = 1;
  string label = 2;
  string mode = 3;        // "image" | "video" | "tts" | "audio"
  string engine = 4;      // "diffusers" | "v1_bridge" | "mock"
  string pipeline = 5;
  string repo = 6;
  int32 steps = 7;
  int32 vram_gb = 8;
  string family = 9;
  bool available = 10;    // listo para generar YA (pesos en disco; + volumen V1 montado si aplica)
  string notes = 11;
  bool downloaded = 12;   // pesos completos en disco (no se vuelve a bajar)
  bool downloading = 13;  // descarga en curso ahora mismo
  float download_percent = 14; // 0..100 mientras descarga
  int64 size_bytes = 15;  // pesos completos en disco (0 si no hay ninguno)
  string download_error = 16; // último error de descarga/borrado
  string download_path = 17; // ruta absoluta de los pesos en disco
}

message ListModelsResponse {
  repeated ModelInfo models = 1;
  string device_name = 2;
  bool cuda_available = 3;
}

// Resultado de una operación de gestión de pesos (descarga / borrado).
message ModelOperationResponse {
  string key = 1;
  // "idle" | "downloading" | "ready" | "failed" | "deleted"
  string state = 2;
  float progress = 3;       // 0..100
  int64 bytes_downloaded = 4;
  int64 total_bytes = 5;
  string error = 6;         // vacío si no hubo error
}

message DownloadModelRequest {
  string key = 1;           // clave del catálogo (engines/base.py)
  bool cancel = 2;           // true = abortar la descarga en curso
}

message DeleteModelRequest {
  string key = 1;
}

message GetModelStateRequest {
  string key = 1;           // vacío = estado de todos los modelos
}

message GetModelStateResponse {
  repeated ModelOperationResponse states = 1;
  int64 bytes_on_disk = 2;   // peso total de los pesos descargados
}

message MediaGenerationRequest {
  string job_id = 1;
  string mode = 2; // "video" o "image"
  string model_name = 3;
  string prompt = 4;
  string negative_prompt = 5;
  int32 width = 6;
  int32 height = 7;
  int32 num_frames = 8;
  int32 fps = 9;
  int32 steps = 10;
  float cfg_scale = 11;
  int64 seed = 12;
  repeated LoraConfig loras = 13;
}

message LoraConfig {
  string name = 1;
  string path = 2;
  float weight = 3;
}

message GenerationProgressResponse {
  string job_id = 1;
  int32 current_step = 2;
  int32 total_steps = 3;
  float percentage = 4;
  string eta_seconds = 5;
  string status = 6; // "LOADING_MODEL", "GENERATING", "POSTPROCESSING", "COMPLETED", "FAILED", "CANCELLED"
  string preview_base64 = 7; // Frame de preview opcional
  string output_file_path = 8;
  string error_message = 9;
}

message CancelRequest {
  string job_id = 1;
}

message CancelResponse {
  string job_id = 1;
  bool accepted = 2; // false si el job no está activo en el worker
}

message AudioTranscriptionRequest {
  string audio_path = 1;
  string language = 2;
  bool diarization = 3;
}

message TranscriptionResponse {
  string text = 1;
  float bpm = 2;
  repeated AudioSegment segments = 3;
}

message AudioSegment {
  float start_time = 1;
  float end_time = 2;
  string speaker = 3;
  string text = 4;
}

message PromptEnhanceRequest {
  string raw_prompt = 1;
  string target_model = 2;
  string style = 3;
}

message PromptEnhanceResponse {
  string enhanced_prompt = 1;
  string rationale = 2;
}

message GpuTelemetryRequest {}

message GpuTelemetryResponse {
  string device_name = 1;
  int64 total_vram_mb = 2;
  int64 used_vram_mb = 3;
  int64 free_vram_mb = 4;
  float gpu_utilization = 5;
  float temperature_c = 6;
}
