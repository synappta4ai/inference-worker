# Catálogo de modelos del inference worker.
#
# engines/base.py lo lee al arrancar (load_catalog) y, si falta, no se puede
# parsear o no tiene entradas válidas, cae al dict embebido BUILTIN_CATALOG.
# BM_MODEL_CATALOG permite apuntar a otra ruta.
#
# Reglas:
#   * La clave del mapa ES el model_name que manda back-synapta: no cambiarla.
#   * engine: diffusers | v1_bridge | mock
#   * repo: repo de Hugging Face (obligatorio salvo engine=mock)
#   * null / campo ausente = default del ModelSpec de engines/base.py
#   * tests/test_catalog_yaml.py falla si este archivo y BUILTIN_CATALOG
#     divergen en cualquier campo (agregar un modelo = tocar ambos).
models:
  # ==================================================================
  # IMAGEN — factoría genérica diffusers (pesos públicos de HF)
  # ==================================================================
  SD-1.5:
    key: "SD-1.5"
    label: "Stable Diffusion 1.5 (imagen real, ligera)"
    engine: diffusers
    repo: "stable-diffusion-v1-5/stable-diffusion-v1-5"
    mode: image
    pipeline: sd15
    dtype: null
    steps: 20
    guidance_scale: 7.5
    max_side: 512
    vram_gb: 4
    family: sd
    notes: "3060, 4060, 5050 e Intel Arc: 512 px en fp16; en iGPU Ryzen corre en CPU fp32"
  SD-Turbo:
    key: "SD-Turbo"
    label: "SD Turbo (imagen en 1-4 pasos)"
    engine: diffusers
    repo: "stabilityai/sd-turbo"
    mode: image
    pipeline: sd15
    dtype: float16
    steps: 4
    guidance_scale: 0.0
    max_side: 512
    vram_gb: 4
    family: sd
    notes: "CPU/iGPU (Ryzen, Intel UHD): 512 px en 4 pasos, fp32 automático"
  SDXL-Turbo:
    key: "SDXL-Turbo"
    label: "SDXL Turbo (imagen real, 1-2 pasos)"
    engine: diffusers
    repo: "stabilityai/sdxl-turbo"
    mode: image
    pipeline: sdxl
    dtype: float16
    steps: 2
    guidance_scale: 0.0
    max_side: 512
    vram_gb: 8
    family: sdxl
    notes: "8 GB en adelante: 512 px en 2 pasos"
  SDXL-Base:
    key: "SDXL-Base"
    label: "SDXL Base 1.0 (imagen HQ)"
    engine: diffusers
    repo: "stabilityai/stable-diffusion-xl-base-1.0"
    mode: image
    pipeline: sdxl
    dtype: float16
    steps: 30
    guidance_scale: 7.5
    max_side: 1024
    vram_gb: 12
    family: sdxl
    notes: ""
  FLUX.1-schnell:
    key: "FLUX.1-schnell"
    label: "FLUX.1 schnell (imagen rápida, 4 pasos)"
    engine: diffusers
    repo: "black-forest-labs/FLUX.1-schnell"
    mode: image
    pipeline: flux
    dtype: bfloat16
    steps: 4
    guidance_scale: 0.0
    max_side: 1024
    vram_gb: 16
    family: flux
    notes: "12 GB; en 8 GB solo con NF4/offload"
  FLUX.1-dev:
    key: "FLUX.1-dev"
    label: "FLUX.1 dev (imagen HQ)"
    engine: diffusers
    repo: "black-forest-labs/FLUX.1-dev"
    mode: image
    pipeline: flux
    dtype: bfloat16
    steps: 28
    guidance_scale: 3.5
    max_side: 1024
    vram_gb: 24
    family: flux
    notes: ""
  # ==================================================================
  # VIDEO — factoría genérica diffusers (pesos públicos de HF)
  # ==================================================================
  LTX-Video:
    key: "LTX-Video"
    label: "LTX-Video 0.9 (video rápido 2B)"
    engine: diffusers
    repo: "Lightricks/LTX-Video"
    mode: video
    pipeline: ltx
    dtype: bfloat16
    steps: 30
    guidance_scale: 3.0
    max_side: 704
    vram_gb: 12
    family: ltx
    notes: ""
  Wan2.1-T2V-1.3B:
    key: "Wan2.1-T2V-1.3B"
    label: "Wan 2.1 T2V 1.3B (video ligero)"
    engine: diffusers
    repo: "Wan-AI/Wan2.1-T2V-1.3B-Diffusers"
    mode: video
    pipeline: wan
    dtype: float16
    steps: 30
    guidance_scale: 5.0
    max_side: 480
    # 10 era el spec fp16 del modelo entero; con el text encoder cuantizado
    # a 4-bit (pico real en VRAM) alcanza de sobra en la T4 de Colab.
    vram_gb: 6
    family: wan
    notes: "8 GB: TE 4-bit + VAE fp32 (pico medido 7,69 GB)"
  Wan2.1-T2V-14B:
    key: "Wan2.1-T2V-14B"
    label: "Wan 2.1 Video (14B High Quality)"
    engine: diffusers
    repo: "Wan-AI/Wan2.1-T2V-14B-Diffusers"
    mode: video
    pipeline: wan
    dtype: bfloat16
    steps: 40
    guidance_scale: 5.0
    max_side: 720
    vram_gb: 40
    family: wan
    notes: "multi-GPU u offload agresivo"
  HunyuanVideo:
    key: "HunyuanVideo"
    label: "HunyuanVideo (video HQ)"
    engine: diffusers
    repo: "tencent/HunyuanVideo"
    mode: video
    pipeline: hunyuan
    dtype: bfloat16
    steps: 30
    guidance_scale: 6.0
    max_side: 720
    vram_gb: 45
    family: hunyuan
    notes: ""
  CogVideoX-5B:
    key: "CogVideoX-5B"
    label: "CogVideoX 5B (video)"
    engine: diffusers
    repo: "THUDM/CogVideoX-5b"
    mode: video
    pipeline: cogvideo
    dtype: bfloat16
    steps: 6
    guidance_scale: 6.0
    max_side: 720
    vram_gb: 16
    family: cogvideo
    notes: ""

  # ==================================================================
  # FAMILIAS V1 CON CÓDIGO PROPIETARIO → bridge (activar montando app/models)
  # ==================================================================
  LTX-Video-2.5:
    key: "LTX-Video-2.5"
    label: "LTX-2.5 22B (video+audio nativo, vía bridge V1)"
    engine: v1_bridge
    repo: "DeepBeepMeep/LTX-2"
    mode: video
    pipeline: ltx25
    dtype: bfloat16
    steps: 30
    guidance_scale: null
    max_side: null
    vram_gb: 48
    family: ltx2.5
    notes: "requiere mmgp==3.7.12 y volumen /models"
  MiniMax-H3-High:
    key: "MiniMax-H3-High"
    label: "MiniMax H3 (video con audio, vía bridge V1)"
    engine: v1_bridge
    repo: "MiniMax/H3"
    mode: video
    pipeline: minimax_h3
    dtype: bfloat16
    steps: 30
    guidance_scale: null
    max_side: null
    vram_gb: 48
    family: minimax
    notes: "SLA_LICENSE — código no redistribuible"
  Kandinsky5:
    key: "Kandinsky5"
    label: "Kandinsky 5 (vía bridge V1)"
    engine: v1_bridge
    repo: "ai-forever/Kandinsky5.0"
    mode: video
    pipeline: kandinsky5
    dtype: bfloat16
    steps: 30
    guidance_scale: null
    max_side: null
    vram_gb: 40
    family: kandinsky
    notes: ""
  Krea2:
    key: "Krea2"
    label: "Krea 2 (vía bridge V1)"
    engine: v1_bridge
    repo: "krea/krea-2"
    mode: image
    pipeline: krea2
    dtype: bfloat16
    steps: 28
    guidance_scale: null
    max_side: null
    vram_gb: 32
    family: krea
    notes: ""
  LongCat-Video:
    key: "LongCat-Video"
    label: "LongCat Video (vía bridge V1)"
    engine: v1_bridge
    repo: "meituan-longcat/LongCat-Video"
    mode: video
    pipeline: longcat
    dtype: bfloat16
    steps: 30
    guidance_scale: null
    max_side: null
    vram_gb: 40
    family: longcat
    notes: ""
  Ideogram4:
    key: "Ideogram4"
    label: "Ideogram 4 (vía bridge V1)"
    engine: v1_bridge
    repo: "ideogram-ai/ideogram-v4"
    mode: image
    pipeline: ideogram4
    dtype: bfloat16
    steps: 28
    guidance_scale: null
    max_side: null
    vram_gb: 32
    family: ideogram
    notes: ""
  Z-Image:
    key: "Z-Image"
    label: "Z-Image (vía bridge V1)"
    engine: v1_bridge
    repo: "tongyi/Z-Image"
    mode: image
    pipeline: z_image
    dtype: bfloat16
    steps: 20
    guidance_scale: null
    max_side: null
    vram_gb: 16
    family: z_image
    notes: ""

  # ==================================================================
  # MÚSICA — vía bridge V1 (código propietario, no corre local)
  # ==================================================================
  YuE2-Music:
    key: "YuE2-Music"
    label: "YuE2 (música completa con voz, vía bridge V1)"
    engine: v1_bridge
    repo: "microsoft/YuE2"
    mode: audio
    pipeline: yue2
    dtype: null
